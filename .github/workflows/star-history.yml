# Star History 每日自动更新（自托管，替代第三方 star-history 服务）。
#
# GitHub 将 stargazers 端点限制为仅仓库管理员/协作者可读后，第三方服务的
# 静态图会渲染「GitHub restricted access」提示图。本工作流改用仓库内置的
# GITHUB_TOKEN（不出仓库、无需个人令牌）分页拉取 stargazers，调用
# tool/star_history.py 生成 docs/star-history.svg 并自动提交，README 引用本地图。
#
# 触发：
#   - 每天 UTC 00:15 定时；
#   - 手动触发（Actions 页 → Update Star History → Run workflow）。

name: Update Star History

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write # 提交生成的 SVG 需要写权限

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 star-history.svg
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tool/star_history.py

      - name: 提交更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 更新 Star History 图表"
          file_pattern: docs/star-history.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
